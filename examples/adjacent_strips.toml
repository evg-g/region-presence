# Layout from the assignment sketch: Outside | A | B | Outside, moving left to right.
# A and B share a boundary at x = 30. Regions are tall strips (height 200).

[simulation]
duration_s = 60
dt = 0.1
seed = 1

[motion]
mean_speed = 1.4

[path]
kind = "waypoints"
closed = false           # one pass, left to right
points = [[-5, 3], [20, 4], [40, 2], [70, 3]]

[regions.A]
shape = "rectangle"
center = [20, 0]
width = 20
height = 200

[regions.B]
shape = "rectangle"
center = [40, 0]
width = 20
height = 200
