# Rotated rectangles, a noisier sensor and a more erratic walker.

[simulation]
duration_s = 240
dt = 0.1
seed = 3

[sensor]
noise_std = 0.1

[motion]
mean_speed = 1.2
speed_std = 0.7
correlation_time = 3.0
max_speed = 3.5

[path]
kind = "waypoints"
closed = true
points = [[0, 30], [22, 22], [45, 40], [70, 28], [90, 45], [60, 58], [30, 52]]

[regions.A]
center = [22, 26]
width = 22
height = 12
rotation_deg = 30

[regions.B]
center = [70, 32]
width = 16
height = 24
rotation_deg = -20
