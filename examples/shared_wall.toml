# Case 2: rectangles A and B share a whole wall (x = 30); they do not overlap.
# Sequence: Outside -> A -> B -> Outside (direct A -> B, no Outside in between).

[simulation]
duration_s = 60
dt = 0.1
seed = 1

[motion]
mean_speed = 1.4

[path]
kind = "waypoints"
closed = false
points = [[-5, 20], [20, 21], [40, 19], [70, 20]]

[regions.A]             # x in [10, 30], y in [12, 28]
center = [20, 20]
width = 20
height = 16

[regions.B]             # x in [30, 50], y in [12, 28]
center = [40, 20]
width = 20
height = 16
