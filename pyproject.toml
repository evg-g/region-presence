[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "region-presence"
version = "1.0.0"
description = "Real-time In A / In B / Outside classification from boundary-distance readings, with a simulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff", "mypy"]

[project.scripts]
region-presence = "region_presence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
region_presence = ["default_config.toml", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
